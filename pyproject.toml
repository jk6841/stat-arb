[project]
name = "stat-arb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = []
requires-python = ">=3.14.6"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "vectorbt>=1.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["*.pkl", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["stat_arb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
